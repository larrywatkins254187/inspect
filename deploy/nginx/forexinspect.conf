# Nginx reverse proxy for ForexInspect (template). Install as /etc/nginx/sites-available/forexinspect.
# TLS certificates and the Cloudflare real-IP ranges are host prerequisites; verify before enabling.
upstream forexinspect_app {
    server 127.0.0.1:3417;
    keepalive 16;
}

# Behind Cloudflare: trust CF-Connecting-IP only from Cloudflare ranges (keep this list current).
# include /etc/nginx/snippets/cloudflare-real-ip.conf;   # set_real_ip_from ...; real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name forexinspect.com www.forexinspect.com;
    return 308 https://forexinspect.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.forexinspect.com;
    ssl_certificate     /etc/ssl/forexinspect/fullchain.pem;
    ssl_certificate_key /etc/ssl/forexinspect/privkey.pem;
    return 308 https://forexinspect.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name forexinspect.com;
    ssl_certificate     /etc/ssl/forexinspect/fullchain.pem;
    ssl_certificate_key /etc/ssl/forexinspect/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 32k;           # Ask bodies are ≤16 KiB; nothing else accepts uploads
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Immutable hashed build assets.
    location /_next/static/ {
        proxy_pass http://forexinspect_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # No shared HTML cache: evidence pages re-check expiry/withdrawal/policy on every request.
    location / {
        proxy_pass http://forexinspect_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;          # used (salted+hashed) for Ask rate limits
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 70s;                            # > Ask provider timeout (50 s)
    }
}
